<!doctype html>
<html lang="zh"><meta charset="utf-8"><title>feedback</title>
<style>
:root { --bg:#fcfcfa; --ink:#1c1c1a; --dim:#9a978d; --line:#e6e3da; --mark:#ffe9a3; --hl:#d9f2e3; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink);
  font:14px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace; }
#top { position:sticky; top:0; z-index:5; background:#fff; border-bottom:1px solid var(--line);
  padding:7px 14px; display:flex; gap:10px; align-items:center; font-size:12px; color:var(--dim); }
#top b { color:var(--ink); font-weight:600; }
#top .sp { flex:1; }
#doc { max-width:1040px; margin:0 auto; padding:24px 18px 45vh; }
.pg { position:relative; margin:0 auto 18px; background:#fff; border:1px solid var(--line);
  box-shadow:0 1px 3px rgba(0,0,0,.05); }
.pg img { display:block; width:100%; height:auto; position:relative; z-index:2; pointer-events:none; }
.pg .pno { position:absolute; right:-34px; top:0; font-size:11px; color:#c3c0b6; }
.pg .hl, .pg .tl { position:absolute; inset:0; }
.pg .tl, .pg .tl span { color:transparent !important; -webkit-text-fill-color:transparent !important; text-shadow:none !important; }
.pg ::selection { background: rgba(51,132,255,.30); }
.pg .tl span::selection { background: rgba(51,132,255,.30); }
.pg .tl span { position:absolute; white-space:pre; overflow:hidden;
  transform-origin:0 0; cursor:text; }
.pg .box { position:absolute; border:1px dashed #1a6b4a; background:rgba(217,242,227,.35); }
.mk { position:absolute; border-radius:1px; pointer-events:none; }
.sband { position:absolute; background:rgba(51,132,255,.28); border-radius:1px; pointer-events:none; }
.pg .tl { z-index:1; }
.pg .hl { z-index:3; pointer-events:none; }
.mk .bdg { position:absolute; top:-10px; left:-3px; font-size:9px; line-height:1; padding:1px 3px;
  border-radius:6px; color:#3a3a34; border:1px solid rgba(0,0,0,.18); pointer-events:auto; cursor:pointer; }
#tip { position:fixed; z-index:40; display:none; max-width:340px; background:#fff;
  border:1px solid #d6d3c9; border-radius:6px; box-shadow:0 8px 28px rgba(0,0,0,.13);
  padding:8px 9px; font-size:12px; line-height:1.5; }
#tip .t { white-space:pre-wrap; margin-bottom:6px; }
#tip .a { display:flex; gap:6px; }
#tip button { font-size:11px; padding:2px 8px; }
#box { position:fixed; z-index:30; display:none; background:#fff; border:1px solid #cfccc2;
  border-radius:6px; box-shadow:0 6px 24px rgba(0,0,0,.10); padding:8px; width:440px; }
#box .q { font-size:11px; color:#6b6b62; background:#f4f2ea; padding:3px 6px;
  border-radius:3px; margin-bottom:6px; max-height:70px; overflow:auto; }
#box textarea { width:100%; min-height:64px; font:inherit; font-size:13px; padding:6px;
  border:1px solid var(--line); border-radius:4px; resize:vertical; }
#box .r { display:flex; gap:6px; margin-top:6px; align-items:center; font-size:11px; color:var(--dim); }
button { font:inherit; font-size:12px; padding:3px 10px; border:1px solid var(--line);
  background:#fff; border-radius:4px; cursor:pointer; }
button.p { background:#1a6b4a; color:#fff; border-color:#1a6b4a; }
#list { max-width:1040px; margin:0 auto; padding:0 18px 60px; }
#list h3 { font-size:12px; color:var(--dim); font-weight:500; margin:26px 0 8px;
  border-top:1px solid var(--line); padding-top:12px; }
.e { padding:6px 8px; border-left:2px solid var(--mark); margin-bottom:6px; font-size:13px; }
.e .m { font-size:11px; color:var(--dim); }
.e .q { font-size:11px; color:#6b6b62; }
.e .x { float:right; cursor:pointer; color:#bbb; }
</style>
<div id="top"><b id="name"></b><span id="cnt"></span><span class="sp"></span>
  <button id="copy">复制全部</button><button id="clear">删除全部</button></div>
<div id="doc"></div>
<div id="list"></div>
<div id="tip"><div class="t" id="tiptext"></div><div class="a"><button id="tcopy">复制</button><button id="tdel">删除</button></div></div>
<div id="box">
  <div class="q" id="quote"></div>
  <textarea id="note" placeholder="这里怎么改（Enter 保存，Shift+Enter 换行，Esc 取消）"></textarea>
  <div class="r"><span id="pos"></span><span class="sp" style="flex:1"></span>
    <button id="cancel">取消</button><button class="p" id="ok">保存</button></div>
</div>

<script>
let pages = [], items = [], target = null, tipI = -1, hideT = null, drag = null;
// 文本层只用来划选：true 才把 PDF 的文字用回退字体画出来（会出现第二套字形），false 只留透明空壳
const SHOW_TEXT_LAYER = false;
const PAGE_LINES = {};
const PAL = ["#ffe9a3","#ffd9cb","#d5f0e2","#d6e4ff","#ecdcff","#ffdff0","#e8f6c8","#fff1c2","#cfe9ea","#f2dccb"];
const $ = s => document.querySelector(s);
const ID = decodeURIComponent(location.pathname.split("/").filter(Boolean)[0] || "");
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

async function boot() {
  const d = await (await fetch("/api/" + ID + "/doc")).json();
  pages = d.pages; items = d.items;
  $("#name").textContent = d.id + " · " + d.doc.split("/").pop();
  render();
  clearBands();
  pages.forEach(p => loadText(p));
}

function render() {
  $("#doc").innerHTML = pages.map(p => `
    <div class="pg" data-p="${p.n}" style="width:${Math.min(p.w, 1000)}px">
      <div class="pno">${p.n}</div>
      <img src="/${ID}/p/${p.n}.png" width="${p.w}" height="${p.h}" alt="page ${p.n}">
      <div class="tl"></div>
      <div class="hl"></div>
    </div>`).join("");
  items.forEach((a, i) => {
    const color = PAL[i % PAL.length];
    const layer = document.querySelector(`.pg[data-p="${a.page}"] .hl`);
    if (!layer) return;
    (a.rects || []).forEach((r, j) => {
      const el = document.createElement("div");
      el.className = "mk";
      el.style.cssText = `left:${r.x*100}%;top:${r.y*100}%;width:${r.w*100}%;height:${r.h*100}%;background:${hexA(color,.38)}`;
      if (j === 0) {
        const b = document.createElement("span");
        b.className = "bdg";
        b.textContent = i + 1;
        b.style.background = color;
        b.dataset.i = i;
        el.appendChild(b);
      }
      layer.appendChild(el);
    });
  });
  $("#cnt").textContent = items.length ? `${items.length} 条` : "";
  $("#list").innerHTML = items.length ? "<h3>已记下的反馈</h3>" + items.map((a, i) =>
    `<div class="e"><span class="x" data-i="${i}">×</span>
     <div class="m">第 ${a.page} 页</div>
     <div class="q">«${esc(a.quote || "")}»</div><div>${esc(a.note)}</div></div>`).join("") : "";
  $("#list").querySelectorAll(".x").forEach(x => x.onclick = async () => {
    await fetch("/api/" + ID + "/del", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({index: +x.dataset.i})});
    await boot();
  });
}

async function loadText(p) {
  const box = document.querySelector(`.pg[data-p="${p.n}"]`);
  if (!box) return;
  const r = box.getBoundingClientRect();
  const d = await (await fetch(`/api/${ID}/text?p=${p.n}`)).json();
  const tl = box.querySelector(".tl");
  const H = r.height;
  PAGE_LINES[p.n] = d.lines || [];
  const ghost = SHOW_TEXT_LAYER ? "" : "color:transparent!important;-webkit-text-fill-color:transparent!important;text-shadow:none!important;";
  tl.style.color = "transparent";
  tl.style.webkitTextFillColor = "transparent";
  tl.innerHTML = PAGE_LINES[p.n].map((l, i) => {
    const fs = l.size * H;
    return `<span data-p="${p.n}" data-li="${i}" style="left:${l.x*100}%;top:${l.y*100}%;width:${l.w*100}%;height:${l.h*100}%;` +
           `font-size:${fs.toFixed(2)}px;line-height:${(l.h*H).toFixed(2)}px;${ghost}` +
           `font-family:${/Rom|Times|Serif/i.test(l.font) ? "'Times New Roman',serif" : "'Helvetica Neue',Arial,sans-serif"}">${esc(l.text)}</span>`;
  }).join("");
}

function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}

function openComposer(anchor, page, rects, quote, label) {
  target = {page, rects, quote};
  $("#quote").textContent = label;
  $("#pos").textContent = "p" + page;
  $("#note").value = "";
  const b = $("#box");
  b.style.display = "block";
  b.style.left = Math.max(8, Math.min(anchor.left, window.innerWidth - 452)) + "px";
  let top = anchor.bottom + 10;
  if (top + 210 > window.innerHeight) top = Math.max(8, anchor.top - 220);
  b.style.top = top + "px";
  $("#note").focus();
}

function clearBands() {
  document.querySelectorAll(".sband").forEach(b => b.remove());
}

function paintBands() {
  clearBands();
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || !sel.toString().trim()) return;
  const range = sel.getRangeAt(0);
  const rects = [...range.getClientRects()].filter(r => r.width > 2 && r.height > 2);
  document.querySelectorAll(".pg").forEach(pg => {
    const box = pg.getBoundingClientRect();
    const layer = pg.querySelector(".hl");
    rects.forEach(r => {
      const x0 = Math.max(r.left, box.left), x1 = Math.min(r.right, box.right);
      const y0 = Math.max(r.top, box.top), y1 = Math.min(r.bottom, box.bottom);
      if (x1 - x0 < 2 || y1 - y0 < 2) return;
      const d = document.createElement("div");
      d.className = "sband";
      d.style.cssText = `left:${x0 - box.left}px;top:${y0 - box.top}px;width:${x1 - x0}px;height:${y1 - y0}px`;
      layer.appendChild(d);
    });
  });
}

document.addEventListener("selectionchange", paintBands);

document.addEventListener("mouseup", e => {
  if (drag) {
    const d = drag; drag = null;
    if (!d.el) return;
    const r = {x: +(parseFloat(d.el.style.left) / d.box.width).toFixed(4),
               y: +(parseFloat(d.el.style.top) / d.box.height).toFixed(4),
               w: +(parseFloat(d.el.style.width) / d.box.width).toFixed(4),
               h: +(parseFloat(d.el.style.height) / d.box.height).toFixed(4)};
    d.el.remove();
    if (r.w * d.box.width >= 6 && r.h * d.box.height >= 6) {
      openComposer({left: e.clientX, bottom: e.clientY, top: e.clientY}, +d.pg.dataset.p,
                   [r], "（图片区域）", `第 ${d.pg.dataset.p} 页 · 框选区域`);
    }
    return;
  }
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || !sel.toString().trim()) return;
  const range = sel.getRangeAt(0);
  const spans = [...document.querySelectorAll(".tl span")].filter(sp => range.intersectsNode(sp));
  const per = new Map();
  spans.forEach(sp => {
    const p = +sp.dataset.p, li = +sp.dataset.li;
    const line = (PAGE_LINES[p] || [])[li];
    if (!line) return;
    const box = sp.getBoundingClientRect();
    const r = range.getBoundingClientRect();
    const left = Math.max(r.left, box.left), right = Math.min(r.right, box.right);
    if (right - left < 1) return;
    const f0 = Math.min(1, Math.max(0, (left - box.left) / box.width));
    const f1 = Math.min(1, Math.max(0, (right - box.left) / box.width));
    if (f1 - f0 < 0.005) return;
    if (!per.has(p)) per.set(p, []);
    per.get(p).push({
      x: +(line.x + f0 * line.w).toFixed(4),
      y: +line.y.toFixed(4),
      w: +((f1 - f0) * line.w).toFixed(4),
      h: +line.h.toFixed(4)
    });
  });
  if (!per.size) return;
  const page = +[...per.keys()][0];
  const quote = sel.toString().replace(/\s+/g, " ").trim().slice(0, 300);
  openComposer(range.getBoundingClientRect(), page, per.get(page), quote, `第 ${page} 页 · ${quote}`);
});

$("#doc").addEventListener("mousedown", e => {
  const pg = e.target.closest(".pg");
  if (!pg || !e.altKey) return;
  const box = pg.getBoundingClientRect();
  drag = {pg, box, x0: e.clientX - box.left, y0: e.clientY - box.top, el: null};
  e.preventDefault();
});
document.addEventListener("mousemove", e => {
  if (!drag) return;
  const x = Math.max(0, Math.min(e.clientX - drag.box.left, drag.box.width));
  const y = Math.max(0, Math.min(e.clientY - drag.box.top, drag.box.height));
  const r = {x: Math.min(x, drag.x0), y: Math.min(y, drag.y0),
             w: Math.abs(x - drag.x0), h: Math.abs(y - drag.y0)};
  if (!drag.el) {
    drag.el = document.createElement("div");
    drag.el.className = "box";
    drag.pg.appendChild(drag.el);
  }
  drag.el.style.cssText = `left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px`;
});

$("#ok").onclick = async () => {
  const note = $("#note").value.trim();
  if (!note || !target) return;
  $("#box").style.display = "none";
  window.getSelection().removeAllRanges();
  clearBands();
  await fetch("/api/" + ID + "/add", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({item: {page: target.page, rects: target.rects, quote: target.quote, note}})});
  target = null;
  await boot();
};
$("#cancel").onclick = () => { $("#box").style.display = "none"; target = null; window.getSelection().removeAllRanges(); clearBands(); };
$("#note").onkeydown = e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#ok").click(); }
  if (e.key === "Escape") $("#cancel").click();
};
$("#clear").onclick = () => { if (confirm("删除全部反馈？")) { items = []; sync(); } };

function sync() {
  fetch("/api/" + ID + "/save", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({items})}).then(boot);
}

const tip = () => $("#tip");
function showTip(i, x, y, note) {
  tipI = i;
  $("#tiptext").textContent = (i + 1) + ".  " + note;
  const t = tip();
  t.style.display = "block";
  t.style.left = Math.min(Math.max(8, x - 24), window.innerWidth - 352) + "px";
  let ty = y + 16;
  if (ty + 110 > window.innerHeight) ty = Math.max(8, y - 130);
  t.style.top = ty + "px";
}
$("#doc").addEventListener("mouseover", e => {
  const m = e.target.closest && e.target.closest(".bdg");
  if (!m) return;
  clearTimeout(hideT);
  const i = +m.dataset.i, a = items[i];
  if (!a) return;
  const r = m.getBoundingClientRect();
  showTip(i, r.left, r.bottom, a.note);
});
$("#doc").addEventListener("mouseout", e => {
  if (!(e.target.closest && e.target.closest(".bdg"))) return;
  hideT = setTimeout(() => { if (tipI >= 0) tip().style.display = "none"; }, 220);
});
tip().addEventListener("mouseenter", () => clearTimeout(hideT));
tip().addEventListener("mouseleave", () => { tip().style.display = "none"; });
$("#tcopy").onclick = async () => {
  const a = items[tipI]; if (!a) return;
  await navigator.clipboard.writeText(`p${a.page}  «${a.quote || ""}»\n${a.note}`);
  $("#tcopy").textContent = "已复制"; setTimeout(() => $("#tcopy").textContent = "复制", 1000);
};
$("#tdel").onclick = async () => {
  if (tipI < 0) return;
  const i = tipI; tipI = -1; tip().style.display = "none";
  await fetch("/api/" + ID + "/del", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({index: i})});
  await boot();
};
$("#copy").onclick = async () => {
  const t = items.map((a, i) => `${i+1}. p${a.page}  «${a.quote || ""}»\n   ${a.note}`).join("\n\n");
  await navigator.clipboard.writeText(t);
  $("#copy").textContent = "已复制";
  setTimeout(() => $("#copy").textContent = "复制全部", 1200);
};
boot();
</script>
</html>
